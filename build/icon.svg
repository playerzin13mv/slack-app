<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Source of truth for every app icon. scripts/generate-icons.mjs derives the other variants from the
       "plate" (background) and "glyph" (foreground) groups, so keep both groups flat (no nested <g>). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="16" result="blur"/>
      <feComponentTransfer in="blur" result="soft"><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="plate">
    <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg)"/>
    <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#shine)"/>
  </g>
  <g id="glyph">
    <path filter="url(#shadow)" fill="#ffffff" d="M512 238c-158 0-286 106-286 238 0 74 41 140 106 183l-24 118 128-70c24 5 49 8 76 8 158 0 286-106 286-238S670 238 512 238z"/>
    <path d="M478 362 432 586M592 362 546 586M403 420h240M381 528h240" fill="none" stroke="url(#mark)" stroke-width="50" stroke-linecap="round"/>
    <circle cx="732" cy="318" r="56" fill="#22c55e" stroke="#ffffff" stroke-width="18"/>
  </g>
</svg>
